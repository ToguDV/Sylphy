spring.application.name=Sylphy
telegram.bot.name=SylphyBot
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.notification.chat-id=${TELEGRAM_NOTIFICATION_CHAT_ID:}
#spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai/
spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY:}
#spring.ai.openai.chat.options.model=gemini-3.5-flash
spring.ai.openai.chat.options.model=nemotron-3-ultra-550b-a55b:free
sylphy.scheduler.tick-millis=60000
sylphy.conversation.id=owner-1
sylphy.system-prompt.default=${SYLPHY_SYSTEM_PROMPT_DEFAULT:}
sylphy.ai.retry.max-attempts=3
sylphy.ai.retry.delay-ms=2000
sylphy.chat.history.window=40
sylphy.chat.memory.cron.daily=0 0 2 * * *
sylphy.chat.memory.cron.weekly=0 0 3 * * MON
sylphy.chat.memory.cron.monthly=0 0 4 1 * *
sylphy.chat.memory.cron.annual=0 0 5 1 1 *
spring.config.import=optional:file:.env[.properties]