spring.application.name=Sylphy
telegram.bot.name=SylphyBot
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.notification.chat-id=${TELEGRAM_NOTIFICATION_CHAT_ID:}
#spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai/
spring.ai.openai.base-url=https://api.mistral.ai/v1
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY:}
#spring.ai.openai.chat.options.model=gemini-3.5-flash
spring.ai.openai.chat.options.model=mistral-small-latest
spring.config.import=optional:file:.env[.properties]